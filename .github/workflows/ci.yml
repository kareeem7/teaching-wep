name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: فحص الجودة والاختبارات
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: سحب المستودع
        uses: actions/checkout@v4

      - name: تهيئة Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: تثبيت التبعيات
        run: npm ci

      - name: فحص JavaScript
        run: npm run lint:js

      - name: فحص CSS
        run: npm run lint:css

      - name: فحص HTML
        run: npm run lint:html

      - name: اختبارات الوحدة
        run: npm run test:unit

      - name: تجهيز متصفح Playwright
        run: npx playwright install --with-deps chromium

      - name: اختبارات الدخان
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: حفظ artefacts عند الفشل
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
            docs/test-artifacts/playwright-report.json
          retention-days: 7
          if-no-files-found: ignore
