# رحلة إدارة المدرس عبر HTTP حقيقي — تشغيل يدوي فقط (workflow_dispatch)
#
# لماذا هنا؟ لأن أداة التنفيذ لا تملك خروجًا شبكيًا إلى *.supabase.co، وCI يملكه.
# هذه المهمة هي القناة الوحيدة التي تُنتج دليلًا حقيقيًا لبوابة اعتماد المرحلة ٠٣.
#
# التشغيل: تلقائي على كل دفع إلى فرع الجلسة + يدوي عند الحاجة.
#   السبب (F-40): التشغيل اليدوي وحده جعل كل دورة إصلاح تتوقف على ضغطة بشرية،
#   وأداة التنفيذ لا تملك صلاحية dispatch (403). النشر التلقائي محصور في مشروع
#   الاختبار `wdqupfoznngqbyphjnie` — ولا يمسّ الإنتاج إطلاقًا.
#
# ⚠️ المهاجرات لا تُطبَّق من هنا (لا يوجد DB password في الأسرار): يجب تطبيق
#   `supabase/migrations/*.sql` على أي بيئة جديدة قبل الرحلة (L-58).
#
# الأسرار المطلوبة في المستودع (Settings → Secrets → Actions):
#   SUPABASE_ACCESS_TOKEN   توكن حساب Supabase (للنشر فقط)
#   TEST_SERVICE_ROLE_KEY   مفتاح خدمة مشروع الاختبار (لإعداد حسابات اصطناعية)
#   TEST_ANON_KEY           المفتاح العام لمشروع الاختبار
#   TEST_ADMIN_PASSWORD     كلمة مرور اصطناعية
#   TEST_TEACHER_PASSWORD   كلمة مرور اصطناعية
# لا تُطبع أي قيمة منها في السجل.

name: رحلة الإدارة (HTTP)

on:
  push:
    branches:
      - arena/4704f40e-teaching-wep
  workflow_dispatch:
    inputs:
      project_ref:
        description: 'مرجع مشروع الاختبار (ليس الإنتاج)'
        required: true
        default: 'wdqupfoznngqbyphjnie'
      admin_phone:
        description: 'هاتف سوبر أدمن اصطناعي (+20...)'
        required: true
        default: '+201000000901'
      teacher_phone:
        description: 'هاتف مدرس اصطناعي (+20...)'
        required: true
        default: '+201000000902'
      deploy_functions:
        description: 'انشر الدوال قبل الرحلة'
        type: boolean
        default: true

concurrency:
  group: admin-journey
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  journey:
    name: نشر ورحلة
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: تثبيت نظيف
        run: npm ci

      - name: تجميع الدوال (R-38)
        run: npm run bundle:functions

      - name: نشر الدوال الست على بيئة الاختبار
        if: ${{ inputs.deploy_functions != false }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/journey.log) 2>&1
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::السر SUPABASE_ACCESS_TOKEN غير مضبوط — لا يمكن النشر."
            exit 1
          fi
          echo "نسخة CLI:"; npx --yes "supabase@^3" --version || true
          # تشخيص آمن للتوكن: الطول وأول ٤ حروف فقط (لا تُطبع القيمة)
          echo "طول التوكن: ${#SUPABASE_ACCESS_TOKEN} · يبدأ بـ: ${SUPABASE_ACCESS_TOKEN:0:4} ·"
          echo "عدد الأسطر: $(printf %s "$SUPABASE_ACCESS_TOKEN" | wc -l)"
          for name in admin-teachers admin-instructions auth-login auth-recovery invite-accept workspace-select; do
            # CLI يشترط مُدخلًا؛ اسمه الافتراضي index.ts. الحزمة JavaScript خالص،
            # وTS مجموعة شاملة لـJS، فننسخها باسم index.ts (المصدر index.js يبقى كما هو).
            cp "supabase/.bundles/${name}.js" "supabase/functions/${name}/index.ts"
            echo "→ نشر ${name} ($(wc -c <"supabase/functions/${name}/index.ts") بايت)"
            if ! npx --yes "supabase@^3" functions deploy "${name}" \
                 --remote="${{ inputs.project_ref || 'wdqupfoznngqbyphjnie' }}" --yes; then
              echo "::warning::فشل النشر العادي — إعادة بمفتاح --debug لالتقاط السبب"
              npx --yes "supabase@^3" functions deploy "${name}" \
                --remote="${{ inputs.project_ref || 'wdqupfoznngqbyphjnie' }}" --yes --debug 2>&1 | tail -80 || true
              echo "::error::فشل نشر ${name} — راجع الرسالة أعلاه"
              exit 1
            fi
          done
          echo "::notice::تم إرسال الدوال الست."

      # F-43: النشر الذي «ينجح» بلا أثر هو أسوأ أنواع الفشل. هذا الفحص يقرأ كود
      # الدالة كما هو منشور فعلًا من Management API ويقارن بصمة البناء بالالتزام.
      - name: التحقق من أن المنشور هو كود هذا الالتزام (F-43)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ inputs.project_ref || 'wdqupfoznngqbyphjnie' }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          exec > >(tee -a /tmp/journey.log) 2>&1
          stamp="${SHA:0:12}"
          echo "البصمة المتوقعة: ${stamp}"
          bad=0
          for name in admin-teachers admin-instructions auth-login auth-recovery invite-accept workspace-select; do
            body=$(curl -sS --max-time 30 \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              "https://api.supabase.com/v1/projects/${REF}/functions/${name}/body" || true)
            if printf '%s' "$body" | grep -q "FUNCTION_BUILD = '${stamp}'"; then
              echo "PASS · المنشور ${name} = ${stamp}"
            else
              found=$(printf '%s' "$body" | grep -o "FUNCTION_BUILD = '[^']*'" | head -1)
              echo "::error::الدالة ${name} المنشورة ليست كود هذا الالتزام (متوقع ${stamp} · وُجد: ${found:-لا بصمة})"
              bad=1
            fi
          done
          exit $bad

      - name: الرحلة الكاملة عبر HTTP
        env:
          # F-43: الرحلة تقارن بصمة الدوال المنشورة بهذا الالتزام وترفض النشر القديم
          EXPECTED_BUILD: ${{ github.sha }}
          TEST_SUPABASE_URL: https://${{ inputs.project_ref || 'wdqupfoznngqbyphjnie' }}.supabase.co
          TEST_SERVICE_ROLE_KEY: ${{ secrets.TEST_SERVICE_ROLE_KEY }}
          TEST_ANON_KEY: ${{ secrets.TEST_ANON_KEY }}
          TEST_ADMIN_PHONE: ${{ inputs.admin_phone || '+201000000901' }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          TEST_TEACHER_PHONE: ${{ inputs.teacher_phone || '+201000000902' }}
          TEST_TEACHER_PASSWORD: ${{ secrets.TEST_TEACHER_PASSWORD }}
        run: |
          set -o pipefail
          exec > >(tee -a /tmp/journey.log) 2>&1
          node scripts/admin-journey.mjs

      - name: نشر نتيجة الرحلة كتعليق على الالتزام
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -uo pipefail
          if [ ! -f /tmp/journey.log ]; then echo "لا سجل محلي"; exit 0; fi
          # F-40: التعليق يُنشر في النجاح أيضًا — بدونه لا يمكن قراءة الخطوات
          # التي مرّت، فكان كل تحقّق يحتاج تشغيلًا إضافيًا.
          {
            if [ "${JOB_STATUS}" = "success" ]; then
              echo "### نتيجة رحلة الإدارة: نجحت"
            else
              echo "### نتيجة رحلة الإدارة: لم تنجح"
            fi
            echo '```'
            tail -c 6000 /tmp/journey.log
            echo '```'
          } > /tmp/comment.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -f body="$(cat /tmp/comment.md)" >/dev/null && echo "نُشر التعليق." || echo "تعذّر نشر التعليق."

      - name: حفظ سجل الرحلة
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-journey-log
          path: admin-journey-log.json
          retention-days: 14
          if-no-files-found: warn
