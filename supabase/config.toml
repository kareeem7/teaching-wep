# =====================================================================
#  إعداد Supabase — بيئة تطوير/اختبار منعزلة (المرحلة ٠١)
#  لا يوجد هنا أي سرّ: المفاتيح تُولَّد محليًا عند التشغيل ولا تُدفع.
#  لا يُشغَّل هذا الملف على أي مشروع إنتاج.
# =====================================================================

project_id = "minhaj-dev"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions", "app"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = false

[storage]
enabled = true
file_size_limit = "5MiB"

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:4173"
additional_redirect_urls = ["http://127.0.0.1:4173", "http://localhost:4173"]
# جلسة قصيرة عمدًا: الإيقاف يجب أن يسري سريعًا (AUTH_DESIGN §٥)
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = false
# لا مزوّد SMS مدفوعًا: يُنشأ المستخدم بهاتف مؤكَّد من الخادم (C-28)
enable_confirmations = false

# =====================================================================
#  الدوال الحيّة: التحقق من JWT يتم داخل الدالة نفسها (R-42 / بوابة ٠٣)
#  verify_jwt = false هنا يعني أن البوابة لا تفرض توكنًا قبل الكود،
#  وكل دالة تتحقق بنفسها: جلسة (`requireSession`) أو رمز دعوة مبصوم.
#  بدونه تُرفض `invite-accept` عند البوابة بلا توكن قبل أن تصل للكود.
#  هذه القيم تُطبَّق على النشر عبر Supabase CLI (قناة `admin-journey.yml`).
# =====================================================================

[functions.admin-teachers]
verify_jwt = false

[functions.admin-instructions]
verify_jwt = false

[functions.auth-login]
verify_jwt = false

[functions.auth-recovery]
verify_jwt = false

[functions.invite-accept]
verify_jwt = false

[functions.workspace-select]
verify_jwt = false
