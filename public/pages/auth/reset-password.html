<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="تعيين كلمة مرور جديدة — المرحلة ٠٢: الهوية والصلاحيات.">
  <meta name="theme-color" content="#0b3b5a">
  <meta name="app-version" content="0.2.0">
  <meta name="minhaj-supabase-url" content="">
  <meta name="minhaj-supabase-key" content="">
  <title>مِنهاج — تعيين كلمة مرور جديدة</title>
  <link rel="stylesheet" href="../../assets/vendor/bootstrap/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="../../assets/css/app.css">
</head>
<body data-page-depth="nested" data-page="reset-password">
  <a class="skip-link" href="#main">تجاوز إلى المحتوى</a>
  <p class="visually-hidden-mh" data-live-region role="status" aria-live="polite"></p>

  <div data-component="navbar"></div>

  <main id="main" class="app-content">
    <section class="card-mh card-mh--narrow-sm">
      <h1>تعيين كلمة مرور جديدة</h1>

      <div class="alert alert-warning" role="status">
        <strong>الرمز يعمل مرة واحدة.</strong>
        بعد الحفظ تُنهى كل الجلسات القديمة على كل الأجهزة، ويجب تسجيل الدخول من جديد بكلمة المرور الجديدة.
      </div>

      <form data-form="reset-password" novalidate>
        <div class="field">
          <label class="field__label" for="password">كلمة المرور الجديدة</label>
          <input class="field__control" id="password" name="password" type="password" autocomplete="new-password" required minlength="10">
          <p class="field__hint">١٠ محارف على الأقل، مع حروف وأرقام.</p>
        </div>

        <div class="field">
          <label class="field__label" for="password_confirm">تأكيد كلمة المرور</label>
          <input class="field__control" id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" required minlength="10">
        </div>

        <p class="text-danger-mh" data-form-error role="alert" hidden></p>
        <p class="text-success-mh" data-status role="status" hidden></p>

        <button class="btn-mh btn-mh--block" type="submit" data-action="reset-password">حفظ كلمة المرور</button>
      </form>

      <p class="mt-4 mb-0"><a href="login.html">العودة للدخول</a></p>
    </section>
  </main>

  <footer class="app-footer">
    مِنهاج · الإصدار 0.2.0 · <span class="tnum" data-current-year></span>
  </footer>

  <script src="../../assets/vendor/supabase/supabase.umd.js"></script>
  <script type="module" src="../../assets/js/app.js"></script>
</body>
</html>
