<body data-page-depth="nested" data-page="select-workspace">

      <div class="alert alert-warning" role="status">

      <p class="text-muted-mh" data-workspace-status role="status">جارٍ تحميل مساحاتك…</p>
      <p class="text-danger-mh" data-form-error role="alert" hidden></p>

      <ul class="list-group list-group-flush" data-workspace-list></ul>

      <div class="d-flex gap-2 mt-4">
        <button class="btn-mh btn-mh--ghost" type="button" data-action="reload-workspaces">تحديث القائمة</button>
        <a class="btn-mh btn-mh--ghost" href="login.html">تسجيل الخروج والعودة</a>

  <footer class="app-footer">
    مِنهاج · الإصدار 0.2.0 · <span class="tnum" data-current-year></span>
